[workspace]
resolver = "2"
members = ["crates/late-core", "crates/late-daemon", "crates/isolation-check"]
default-members = ["crates/late-core", "crates/late-daemon"]

[workspace.package]
version = "0.1.9"
edition = "2021"
license = "MIT"
authors = ["Late contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
dirs = "6"
anyhow = "1"
