[workspace]
resolver = "2"
members = ["crates/late-core", "crates/late-daemon", "crates/isolation-check", "crates/late-infer"]
default-members = ["crates/late-core", "crates/late-daemon"]

[workspace.package]
version = "0.1.17"
edition = "2021"
license = "MIT"
authors = ["Late contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.23"
sha2 = "0.11"
hex = "0.4"
toml = "1.1"
dirs = "7"
anyhow = "1"
