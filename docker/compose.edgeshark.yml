# Siemens Edgeshark (Ghostwire + Packetflix), bound to localhost only.
# Images and flags match:
#   https://github.com/siemens/edgeshark/blob/main/deployments/wget/docker-compose-localhost.yaml
#
# Shark-fin live capture into desktop Wireshark needs:
#   https://github.com/siemens/cshargextcap/releases

name: late-edgeshark

services:
  gostwire:
    image: ghcr.io/siemens/ghostwire
    pull_policy: missing
    restart: unless-stopped
    read_only: true
    user: "65534"
    entrypoint:
      - /gostwire
      - --http=[::]:5000
      - --brand=Edgeshark
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
      - SYS_PTRACE
      - DAC_READ_SEARCH
      - DAC_OVERRIDE
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - apparmor:unconfined
    pid: host
    cgroup: host
    networks:
      ghost-in-da-edge:
        priority: 100

  packetflix:
    image: ghcr.io/siemens/packetflix
    pull_policy: missing
    restart: unless-stopped
    read_only: true
    user: "65534"
    entrypoint:
      - /packetflix
      - --port=5001
      - --discovery-service=gostwire.ghost-in-da-edge
      - --gw-port=5000
      - --proxy-discovery
    ports:
      - "127.0.0.1:5001:5001"
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
      - SYS_PTRACE
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - apparmor:unconfined
    pid: host
    networks:
      ghost-in-da-edge:
        priority: 100

networks:
  ghost-in-da-edge:
    name: ghost-in-da-edge
