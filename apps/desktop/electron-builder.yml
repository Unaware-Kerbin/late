appId: dev.late.desktop
productName: Late
copyright: Late contributors
artifactName: Late-${version}-${os}-${arch}.${ext}
electronVersion: 44.0.0
directories:
  output: release
  buildResources: src-tauri/icons
files:
  - dist/**/*
  - electron/main.cjs
  - electron/preload.cjs
extraResources:
  - from: resources/bin
    to: bin
  - from: resources/sidecar.cjs
    to: sidecar.cjs
  - from: ../../policies
    to: policies
linux:
  target:
    - AppImage
    - deb
  category: Network
  maintainer: Late contributors <noreply@users.noreply.github.com>
  icon: src-tauri/icons
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  identity: null
  icon: src-tauri/icons/icon.png
win:
  target:
    - nsis
    - portable
  icon: src-tauri/icons/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
asar: true
