name: Build installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: --linux
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libfuse2 zstd rpm libarchive-tools fakeroot xz-utils zip
      - run: npm ci
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          PACK_LINUX_ALL: "1"
        run: bash scripts/pack.sh ${{ matrix.args }}
      - name: Confirm packed daemon
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.args }}" in
            *--win*) test -f apps/desktop/resources-win/bin/late-daemon.exe ;;
            *--mac*) test -f apps/desktop/resources-mac/bin/late-daemon ;;
            *--linux*) test -f apps/desktop/resources/bin/late-daemon ;;
            *) echo "late: unknown pack args ${{ matrix.args }}" >&2; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: late-${{ matrix.os }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/*.pacman
            apps/desktop/release/*.pkg.tar.*
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
          if-no-files-found: error

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            Installers are **unsigned** (no Apple notarization or Windows Authenticode).

            - **macOS:** right-click Late → Open the first time.
            - **Windows:** if SmartScreen appears, More info → Run anyway.
            - **Linux:** AppImage (any distro; make it executable), `.deb` (Debian/Ubuntu/Mint), `.rpm` (Fedora/RHEL/Rocky/Alma/openSUSE), or `.pacman` (Arch). Docker is optional (Suggests, not Required).
